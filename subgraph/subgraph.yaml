specVersion: 1.2.0
description: Phala Vault unstake-locked PHA for circulation accounting
repository: https://github.com/Phala-Network/phala-vault-state-subgraph
schema:
  file: ./schema.graphql
# The circulation API queries historical blocks for daily snapshots.
indexerHints:
  prune: never
dataSources:
  - kind: ethereum
    name: Vault
    network: mainnet
    source:
      address: "0x21d6eC8fc14CaAcc55aFA23cBa66798DAB3a0ec0"
      abi: Vault
      startBlock: 21596326
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultState
        - VaultStateCheckpoint
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Claimed(indexed address,indexed address,indexed address,uint256)
          handler: handleClaimed
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
      file: ./src/vault.ts
