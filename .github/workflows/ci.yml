name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      subgraph: ${{ steps.filter.outputs.subgraph }}
      circulation-api: ${{ steps.filter.outputs.circulation-api }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            subgraph:
              - 'subgraph/**'
              - &shared 'package.json'
              - &lock 'bun.lock'
              - &biome 'biome.json'
              - &ignore '.gitignore'
              - &ci '.github/workflows/ci.yml'
            circulation-api:
              - 'circulation-api/**'
              - *shared
              - *lock
              - *biome
              - *ignore
              - *ci
            app:
              - 'app/**'
              - *shared
              - *lock
              - *biome
              - *ignore
              - *ci

  subgraph:
    needs: changes
    if: needs.changes.outputs.subgraph == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: circulation-api/package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Matchstick 0.6.0 links libpq on Ubuntu 22.04.
      - run: sudo apt-get update && sudo apt-get install -y libpq5
      - run: bun install --frozen-lockfile
      - run: bun run verify:subgraph

  circulation-api:
    needs: changes
    if: needs.changes.outputs.circulation-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: circulation-api/package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run verify:circulation-api

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: circulation-api/package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run verify:app
